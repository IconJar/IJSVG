<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- The standalone benchmark supplies a detached vector imageNode to feImage. -->
  <defs>
    <filter id="vectorImage" filterUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <feImage x="0" y="0" width="32" height="32" result="image"/>
      <feDropShadow in="image" stdDeviation="0.75" dx="0" dy="1" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="32" height="32" filter="url(#vectorImage)"/>
</svg>
